server:
  port: ${CATALOG_SERVICE_PORT:8081}
spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/balaio_catalog}
    username: ${CATALOG_DB_USERNAME:balaio_catalog_app}
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
balaio:
  internal:
    token: ${BALAIO_INTERNAL_TOKEN:}
  catalog:
    storage:
      enabled: ${CATALOG_S3_ENABLED:false}
      endpoint: ${CATALOG_S3_ENDPOINT:http://localhost:8333}
      region: ${CATALOG_S3_REGION:us-east-1}
      bucket: ${CATALOG_S3_BUCKET:balaio-media}
      access-key: ${CATALOG_S3_ACCESS_KEY_ID:}
      secret-key: ${CATALOG_S3_SECRET_ACCESS_KEY:}
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
