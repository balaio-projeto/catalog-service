server:
  port: ${CATALOG_SERVICE_PORT:8081}
spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/balaio_catalog}
    username: ${CATALOG_DB_USERNAME:balaio_catalog_app}
    password: ${CATALOG_DB_PASSWORD:balaio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html